<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DMACommander. A yellow capsule fellow whose one goggle is a two-panel
       file manager: the joke and the product in the same silhouette. Drawn from
       scratch, so it is ours to ship. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2b3446"/>
      <stop offset="0.55" stop-color="#141a25"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe97a"/>
      <stop offset="0.45" stop-color="#fdd11a"/>
      <stop offset="1" stop-color="#e09b05"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2f5f8"/>
      <stop offset="0.4" stop-color="#b9c2cc"/>
      <stop offset="0.62" stop-color="#e8edf2"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#4a86c8"/>
      <stop offset="1" stop-color="#2b5a91"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="312" y="206" width="400" height="596" rx="200"/>
    </clipPath>
  </defs>

  <!-- The plate. Rounded square, because that is the shape the Dock expects. -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#plate)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Hair: three sprigs, so the top is not a bald dome. -->
  <g stroke="#1b1b20" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M 452 236 q -14 -46 22 -66"/>
    <path d="M 512 222 q 0 -50 0 -62"/>
    <path d="M 572 236 q 14 -46 -22 -66"/>
  </g>

  <!-- Feet, tucked under the body. -->
  <g fill="#262932">
    <rect x="366" y="770" width="120" height="86" rx="42"/>
    <rect x="538" y="770" width="120" height="86" rx="42"/>
  </g>

  <!-- Body. -->
  <rect x="312" y="206" width="400" height="596" rx="200" fill="url(#skin)"/>

  <g clip-path="url(#body)">
    <!-- Overalls: bib, waist, and a pocket. -->
    <path d="M 412 642 h 200 v 168 h -200 z" fill="url(#denim)"/>
    <path d="M 412 660 q 100 -44 200 0 v -32 q -100 -42 -200 0 z" fill="url(#denim)"/>
    <rect x="454" y="690" width="116" height="80" rx="16"
          fill="none" stroke="#1d3f66" stroke-opacity="0.55" stroke-width="8"/>
    <!-- Straps, over the shoulders and past the goggle. -->
    <path d="M 404 648 l -6 -262 q 30 -12 44 6 l 20 250 z" fill="url(#denim)"/>
    <path d="M 620 648 l 6 -262 q -30 -12 -44 6 l -20 250 z" fill="url(#denim)"/>
    <g fill="#e8b33a">
      <circle cx="424" cy="648" r="13"/>
      <circle cx="600" cy="648" r="13"/>
    </g>

    <!-- The goggle strap, running the full width of the head. -->
    <rect x="300" y="330" width="424" height="84" fill="#26262c"/>
    <rect x="300" y="330" width="424" height="12" fill="#3a3a44"/>

    <!-- The mouth: a small, contented smile. -->
    <path d="M 468 552 q 44 40 88 0" fill="none" stroke="#6b430c"
          stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- The goggle. -->
  <circle cx="512" cy="372" r="152" fill="url(#ring)"/>
  <circle cx="512" cy="372" r="152" fill="none" stroke="#5c6672" stroke-width="4"/>
  <circle cx="512" cy="372" r="126" fill="#1b1f27"/>

  <!-- ...whose lens is a two-panel file manager. -->
  <g>
    <rect x="418" y="300" width="88" height="144" rx="10" fill="#0f2f57"/>
    <rect x="518" y="300" width="88" height="144" rx="10" fill="#0b2444"/>
    <rect x="418" y="300" width="88" height="22" rx="10" fill="#2f6db3"/>
    <rect x="518" y="300" width="88" height="22" rx="10" fill="#204d80"/>
    <g fill="#9ec8f0">
      <rect x="430" y="336" width="64" height="9" rx="4"/>
      <rect x="430" y="356" width="48" height="9" rx="4"/>
      <rect x="530" y="336" width="64" height="9" rx="4"/>
      <rect x="530" y="356" width="52" height="9" rx="4"/>
      <rect x="530" y="376" width="40" height="9" rx="4"/>
    </g>
    <!-- The cursor bar on the active side, and a prompt on the other. -->
    <rect x="428" y="374" width="68" height="16" rx="5" fill="#3fd07a"/>
    <rect x="530" y="404" width="14" height="9" rx="4" fill="#3fd07a"/>
  </g>

  <!-- Glass, last, over everything. -->
  <circle cx="512" cy="372" r="126" fill="url(#glass)"/>
  <path d="M 430 300 a 126 126 0 0 1 128 -22 q -96 22 -110 100 z"
        fill="#ffffff" fill-opacity="0.16"/>
</svg>

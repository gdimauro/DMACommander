[package]
name         = "dmac-tui"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description  = "The ratatui terminal user interface."

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
dmac-config = { version = "0.1.0", path = "../dmac-config" }
dmac-core = { version = "0.1.0", path = "../dmac-core" }
dmac-fx = { version = "0.1.0", path = "../dmac-fx" }
dmac-mcp = { version = "0.1.0", path = "../dmac-mcp" }
dmac-pty = { version = "0.1.0", path = "../dmac-pty" }
dmac-session = { version = "0.1.0", path = "../dmac-session" }
dmac-vfs = { version = "0.1.0", path = "../dmac-vfs" }
jiff = "0.2.35"
ratatui = "0.30.2"
futures = "0.3.31"
serde_json = "1.0.145"
dmac-desktop = { path = "../dmac-desktop" }
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time", "signal", "net", "io-util", "fs"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tempfile = "3"

[package]
name         = "dmac-session"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description  = "Named sessions: persistent workspaces and reattachable agent sessions."

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
dmac-core = { version = "0.1.0", path = "../dmac-core" }
dmac-mcp = { version = "0.1.0", path = "../dmac-mcp" }
dmac-pty = { version = "0.1.0", path = "../dmac-pty" }
dmac-vfs = { version = "0.1.0", path = "../dmac-vfs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

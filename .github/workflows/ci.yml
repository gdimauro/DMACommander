name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not only in the clippy job.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first, so an obvious mistake fails in seconds rather than after
  # a full five-platform matrix.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: macos-arm64,    os: macos-latest }
          - { name: macos-x86_64,   os: macos-13 }
          - { name: windows-msvc,   os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs derives the build number from `git rev-list --count HEAD`.
          # A shallow clone would report 1 and quietly make every build look like
          # the first one.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  # The default build must not pull in wgpu, and the gpu feature must not rot.
  # Both directions have to compile or the feature flag is a lie.
  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p dmac --no-default-features
      - run: cargo build -p dmac --features gpu

  # A headless server should get a small static binary with no glibc dependency.
  musl:
    name: linux-musl (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Report binary size
        run: |
          size=$(stat -c%s target/x86_64-unknown-linux-musl/release/dmac)
          echo "dmac: $((size / 1024)) KiB"
          # The budget in CLAUDE.md is 20MB for a release build without the GPU
          # feature. Failing here is the point: size regressions are invisible
          # until someone measures them.
          test "$size" -lt 20971520

  # The declared MSRV has to be real. Raising it is a deliberate act with a
  # changelog entry, not something that happens because a dependency moved.
  msrv:
    name: msrv 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets

  deny:
    name: licences + advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
